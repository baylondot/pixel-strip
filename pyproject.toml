[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-strip"
version = "0.1.0"
description = "Batch background removal and image normalization pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
pixelstrip = "pixelstrip.cli:app"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

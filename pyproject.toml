[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "pixel-strip"
version = "1.0.0"
description = "Batch background removal and image normalization for ML dataset pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow>=10.4,<13", "pydantic>=2.8,<3", "typer>=0.12,<1"]

[project.optional-dependencies]
rembg = ["rembg>=2.0.60,<3"]
gpu = ["onnxruntime-gpu>=1.18,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "hypothesis>=6.110,<7", "pre-commit>=3.7,<5"]
observability = ["opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2"]

[project.scripts]
pixelstrip = "pixelstrip.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelstrip"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=pixelstrip --cov-report=term-missing --cov-fail-under=85"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
